  <line x1="37" y1="46" x2="37" y2="96" stroke="#00f5a0" stroke-width="2"/>
  <rect x="58" y="40" width="10" height="42" rx="2" fill="url(#neonCyan)"/>
  <line x1="63" y1="30" x2="63" y2="92" stroke="#00f2fe" stroke-width="2"/>
